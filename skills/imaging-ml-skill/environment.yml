# environment.yml for imaging-ml-skill (v0.3.0)
#
# Two findings from 2026-07-20 changed this file from the v0.2.x version:
#   1. NumPy MUST be 1.x. pyradiomics 3.0.1's compiled C extension is NumPy-1.x ABI and
#      fails to import under NumPy 2.x ("numpy.core.multiarray failed to import"), even
#      after a forced source rebuild. The prior numpy==2.0.2 pin did not reproduce as
#      working on a clean Linux/Python 3.11 build; only `import radiomics` had been
#      checked on an Apple-Silicon Mac, never a full feature extraction. numpy==1.26.4
#      was verified end to end (real extraction). See references/environment_setup.md.
#   2. idc-index now coexists (previously an open item). The conflict was pandas 2.3.3
#      vs idc-index needing pandas<=2.2.4. Pinning pandas==2.2.3 lets pyradiomics,
#      scikit-learn, SimpleITK, and idc-index all import together. Verified 2026-07-20.
#
# conda manages the interpreter; packages are installed via pip. Because pyradiomics
# builds C at install time, install order matters -- see references/environment_setup.md
# if `conda env create` fails on the pyradiomics build (the venv recipe there pins
# setuptools<65 and uses --no-build-isolation).

name: imaging-ml-env
channels:
  - conda-forge
dependencies:
  - python=3.11          # 3.9-3.11 all work with NumPy 1.x
  - pip
  - setuptools<65        # older setuptools needed to build pyradiomics 3.0.1
  - pip:
      - numpy==1.26.4    # NumPy 1.x REQUIRED (see finding #1 above)
      - pyradiomics==3.0.1
      - SimpleITK==2.5.3
      - scikit-learn>=1.6
      - pandas==2.2.3    # 2.2.x so idc-index can coexist
      - scipy>=1.11,<1.14
      - matplotlib>=3.7
      - seaborn>=0.12
      - PyYAML>=6.0
      - jupyterlab>=4
      - notebook>=7
      - ipykernel>=6
      - openpyxl>=3.1
      - idc-index>=0.11  # resolved: coexists with the above (finding #2)
      - pydicom>=2.3,<3  # DICOM SEG reading; pydicom-seg 0.4.1 needs pydicom<3
      - pydicom-seg>=0.4
      - lifelines>=0.27  # Kaplan-Meier / Cox survival analysis
