# environment.yml for imaging-ml-skill — CONDA FALLBACK
#
# The supported, reproducible path is uv + uv.lock (see references/environment_setup.md).
# This conda file is a fallback that pins the same versions. conda manages the Python 3.11
# interpreter; packages install via pip because pyradiomics builds a C extension at install
# time (an older setuptools and NumPy 1.x must be present first — handled by the ordering
# below).
#
# Key constraints (see references/environment_setup.md for the reproduced failures):
#   - NumPy MUST be 1.x: pyradiomics 3.0.1's C extension is NumPy-1.x ABI and fails to import
#     under NumPy 2.x.
#   - pandas pinned 2.2.3 so idc-index (needs pandas<=2.2.4) can coexist.
#   - JupyterLab is intentionally NOT installed here: pydicom-seg 0.4.1 needs jsonschema<4
#     while modern JupyterLab needs jsonschema>=4.18. Run JupyterLab from outside this env and
#     select the registered "imaging-ml" kernel.

name: imaging-ml-env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - setuptools<65        # older setuptools needed to build pyradiomics 3.0.1
  - pip:
      - numpy==1.26.4    # NumPy 1.x REQUIRED
      - pandas==2.2.3    # 2.2.x so idc-index can coexist
      - scipy==1.13.1
      - scikit-learn==1.6.1
      - SimpleITK==2.5.3
      - pyradiomics==3.0.1
      - matplotlib==3.9.4
      - seaborn==0.13.2
      - PyYAML==6.0.3
      - openpyxl==3.1.5
      - joblib==1.5.1
      - lifelines==0.30.0
      - ipykernel==6.31.0
      # Real-data path (IDC download + DICOM SEG masks):
      - idc-index==0.12.4
      - pydicom==2.4.4
      - pydicom-seg==0.4.1
